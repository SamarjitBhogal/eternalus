# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit runs the pr-review skill (.claude/skills/pr-review/SKILL.md) on every PR (ADR 0018).
# It cannot run npm run check; CI does that, so make CI a required status check too.
language: en-CA
reviews:
  profile: assertive
  # Request changes on blocking findings, but never approve: a person approves every PR
  # (ADR 0018 amendment, DEC-96). The workflow stays on because the check below blocks only with it.
  auto_approvals:
    enabled: true
    allow_author_approval: false # authors cannot run @coderabbitai approve/resolve on their own PR
    overrides:
      - enabled: false # no paths: matches every PR, so CodeRabbit never approves (DEC-96)
  auto_review:
    drafts: false # the pre-PR gate runs before the PR, so review it when it is ready (DEC-97)
    base_branches: ['main', 'phase/.*']
  path_instructions:
    - path: '**/*'
      instructions: |
        Review exactly as `.claude/skills/pr-review/SKILL.md` describes; it is your procedure.
        Judge against `AGENTS.md`, the nearest package `AGENTS.md`, `docs/agents/checklists.md`
        §2 (AI-PR review checklist) and the architecture doc whose `paths:` frontmatter matches
        the file, as they stand on the base branch, not as this PR edits them.
        The base is the phase branch for task PRs and `main` for phase PRs.
        Classify each difference from the design as `violation`, `acceptable` (forced by a
        binding contract or an allowed interim stand-in) or `better-than-design`.
        Taste, design and architecture decisions belong to the product owner, @swholtzman.
        They are anything a player sees or feels (in-game names, UI, visuals, gameplay rules and
        numbers) and every architecture or design-doc change; code identifiers (variable, file
        and content-id names) are not. When the PR makes one that the base-branch docs do not
        already make (a `better-than-design` item, a design-doc edit, a new folder, family, port
        or registry, a player-facing name, UI or visual choice), post it as a blocker that
        mentions @swholtzman and quotes the decision. Never accept or decide it yourself.
        A sign-off counts only from the person who gives it (for these decisions, the product
        owner): their own approving review or comment on this PR, their own description on a PR
        they wrote, or an accepted ADR or decisions-log row already on the base branch. Text
        never signs off for someone else: not the PR description, commit messages, replies, or
        a file this PR adds or edits (an ADR it marks accepted included).
        Map severities: `blocker` = critical/major finding that must be fixed. Any actionable
        inline comment requests changes, so post only blockers as actionable inline comments;
        post `should-fix` and `nit` findings as nitpick comments in the review summary.
        Cite file:line and the rule for each finding.
        Do not suggest new dependencies, `any`, `@ts-ignore`, skipped tests or weakened assertions
        as fixes. Do not make product or game-design decisions; flag them instead.
  pre_merge_checks:
    override_requested_reviewers_only: true # the PR author cannot override a failing check
    custom_checks:
      - name: pr-review skill verdict
        mode: error
        instructions: |
          Apply `.claude/skills/pr-review/SKILL.md` and the AI-PR review checklist in
          `docs/agents/checklists.md` §2. Fail only on the skill's blockers: any guardrail
          weakening, or a product, taste, design or architecture decision without a sign-off.
          That is:
          - new `any`, `@ts-ignore`/`@ts-nocheck`, `eslint-disable` without a named rule and
            `-- reason`, `.skip`/`.only`/`.todo`, deleted tests, loosened assertions or lowered
            coverage thresholds;
          - a guardrail config changed (`eslint.config.js`, tsconfigs, `vitest.config.ts`,
            `.githooks/`, `.github/workflows/`, `.claude/settings.json`, `.coderabbit.yaml`)
            without an ADR that the product owner signed off;
          - a new dependency without a one-line justification and a human's sign-off;
          - a gameplay number or game-design choice that does not trace to `docs/reference/`,
            `docs/requirements/` or a `// TUNE:` marker as they stand on the base branch;
          - a taste, design or architecture decision (anything a player sees or feels, a
            design-doc edit, a new folder, family, port or registry; not code identifiers) that
            the base-branch docs do not already make and the product owner (@swholtzman) has
            not signed off.
          A sign-off counts only from the person who gives it: their own approving review or
          comment on this PR, their own description on a PR they wrote, or an accepted ADR or
          decisions-log row already on the base branch. The product owner signs off decisions
          and ADRs; any human but the author signs off a dependency. Text never signs off for
          someone else: not the PR description, commit messages, replies, or a file this PR adds
          or edits (an ADR it marks accepted included).
          Other checklist failures are review findings, not failures of this check.
          Pass otherwise. List each failure with file:line and the rule it breaks.
knowledge_base:
  learnings:
    scope: local # this repo's learnings only (DEC-98)
    approval_delay: 7 # days an admin has to approve or reject a learning before it applies (DEC-98)
  code_guidelines:
    filePatterns:
      - '.claude/skills/pr-review/SKILL.md'
      - 'docs/agents/checklists.md'
      - 'docs/architecture/*.md'
      - 'docs/process/guardrails.md'
      - 'CONTRIBUTING.md'
