# Copies every CodeRabbit learning into docs/agents/coderabbit-learnings.md and opens a docs PR
# into the newest phase branch, so the product owner reviews each one (ADR 0018, DEC-98).
# GitHub runs scheduled workflows only from the default branch: this starts once it is on main.
# Needs the repo setting "Allow GitHub Actions to create and approve pull requests".
name: CodeRabbit learnings

on:
  schedule:
    - cron: '0 12 */2 * *' # every 2 days (DEC-98); the 31st and the 1st run back to back
  workflow_dispatch:

permissions:
  contents: write # push the docs branch
  pull-requests: write # read CodeRabbit's review-thread replies; open the PR
  issues: read # read CodeRabbit's PR-conversation replies
  actions: write # start CI on the docs branch: a push by this token starts no workflow

concurrency:
  group: coderabbit-learnings

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the base and the docs branch
        run: |
          # ponytail: the newest phase branch is the open phase; pin BASE here if two are active
          base=$(git for-each-ref --sort=-committerdate --count=1 --format='%(refname:lstrip=3)' refs/remotes/origin/phase/)
          open=$(gh pr list --state open --base "$base" --app github-actions --json headRefName \
            --jq '[.[].headRefName | select(startswith("chore/coderabbit-learnings-"))][0] // empty')
          head=${open:-chore/coderabbit-learnings-$(date -u +%F)}
          git switch -C "$head" "origin/${open:-$base}"
          { echo "BASE=$base"; echo "HEAD_BRANCH=$head"; echo "OPEN_PR=$open"; } >> "$GITHUB_ENV"

      - name: Test the parser
        run: node --test scripts/coderabbit/collect-learnings.test.mjs

      - name: Collect the learnings
        run: node scripts/coderabbit/collect-learnings.mjs

      - name: Open or update the docs PR
        run: |
          git diff --quiet && { echo 'No new learnings.'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agents/coderabbit-learnings.md
          git commit -m 'docs(docs): log new CodeRabbit learnings'
          git push -u origin "$HEAD_BRANCH"
          [ -n "$OPEN_PR" ] || gh pr create --base "$BASE" --head "$HEAD_BRANCH" --reviewer swholtzman \
            --title 'docs(docs): log new CodeRabbit learnings' \
            --body 'New CodeRabbit learnings are in `docs/agents/coderabbit-learnings.md`. Product owner: review each new entry and ask the CodeRabbit admin to reword or delete any you disagree with (ADR 0018, DEC-98). Generated by `.github/workflows/coderabbit-learnings.yml`.'
          gh workflow run ci.yml --ref "$HEAD_BRANCH"
